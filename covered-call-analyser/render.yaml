# render.yaml — Render deployment configuration
# Defines two services: FastAPI backend + Streamlit frontend.
#
# HOW TO USE:
#   Option A (Blueprint — recommended):
#     Render dashboard → New → Blueprint → connect repo → Render reads this file.
#
#   Option B (Manual):
#     Create each service manually in the Render dashboard using the
#     buildCommand and startCommand values below.
#
# IMPORTANT: After deploy, you MUST manually set the three secret env vars
# (BREEZE_API_KEY, BREEZE_API_SECRET, BREEZE_SESSION_TOKEN) in the Render
# dashboard — they are marked sync:false so they are never stored in git.
#
# Docs: https://render.com/docs/yaml-spec

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI (Python web service)
  # ---------------------------------------------------------------------------
  - type: web
    name: covered-call-backend
    runtime: python
    region: singapore          # Options: oregon, frankfurt, singapore, ohio
    plan: free                 # Free tier sleeps after 15 min inactivity.
                               # Upgrade to 'starter' (£7/mo) for always-on.

    # cd into the subdirectory so Python sees backend/ as a package.
    # The hyphen in 'covered-call-analyser' prevents using it as a Python
    # module name directly, so we cd in first.
    buildCommand: pip install -r covered-call-analyser/backend/requirements.txt
    startCommand: cd covered-call-analyser && uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    # Render hits this path to verify the service started correctly.
    healthCheckPath: /health

    envVars:
      # --- SECRETS: set these manually in the Render dashboard ---
      # Dashboard → covered-call-backend → Environment → Add Env Var
      - key: BREEZE_API_KEY
        sync: false
      - key: BREEZE_API_SECRET
        sync: false
      - key: BREEZE_SESSION_TOKEN
        sync: false           # Regenerate daily; update here each morning

      # --- Non-secret defaults (committed safely in this file) ---
      - key: DEFAULT_BROKERAGE
        value: "40.0"
      - key: DEFAULT_STT_RATE
        value: "0.001"
      - key: DEFAULT_GST_RATE
        value: "0.18"
      - key: LOG_LEVEL
        value: "INFO"

      # --- Phase 5: QuotaGuard Static proxy (uncomment when ready) ---
      # - key: QUOTAGUARDSTATIC_URL
      #   sync: false

  # ---------------------------------------------------------------------------
  # Frontend — Streamlit (Python web service)
  # ---------------------------------------------------------------------------
  - type: web
    name: covered-call-frontend
    runtime: python
    region: singapore
    plan: free

    buildCommand: pip install -r covered-call-analyser/frontend/requirements.txt
    startCommand: >
      streamlit run covered-call-analyser/frontend/app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false

    envVars:
      # After the backend deploys, copy its Render URL here.
      # Format: https://covered-call-backend.onrender.com
      # (Render assigns this automatically — check the backend service dashboard)
      - key: BACKEND_URL
        value: https://covered-call-backend.onrender.com

      # Health-check URL polled on every page load to show Breeze connection status.
      # Defaults to BACKEND_URL/health when unset.
      # Set to empty string "" to disable the connection banner entirely.
      - key: PING_URL
        value: https://covered-call-backend.onrender.com/health

      # Anthropic API key — used by _fetch_intel_claude() to fetch equity intel and
      # market intelligence via Claude API (replaces yfinance + NSE which are
      # rate-limited on Render's shared IP).
      # Set manually in the Render dashboard — never stored in git.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Set to "true" to skip the Claude API call entirely and return mock data.
      # Useful for development, demos, or when ANTHROPIC_API_KEY is not yet set.
      # Mock values are price-consistent (derived from CMP) but are NOT real data.
      - key: CLAUDE_INTEL_BYPASS
        value: "false"
